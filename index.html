<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>部品台帳</title>
<meta name="description" content="品番・単価・写真・手順書をひとつにまとめて管理。「あの部品いくらだっけ」をすぐ探せる業務アプリのデモ版です。">
<meta property="og:type" content="website">
<meta property="og:title" content="部品台帳｜部品管理アプリ（デモ版）">
<meta property="og:description" content="品番・単価・写真・手順書をひとつにまとめて管理。「あの部品いくらだっけ」をすぐ探せる業務アプリのデモ版です。">
<meta property="og:url" content="https://aurorapolis.github.io/okuba-parts-demo/">
<meta property="og:image" content="https://aurorapolis.github.io/okuba-parts-demo/ogp.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta property="og:site_name" content="部品台帳">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://aurorapolis.github.io/okuba-parts-demo/ogp.jpg">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#303E4C">
  <meta name="apple-mobile-web-app-title" content="部品台帳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDEAE2;
    --paper-alt: #E1DCCE;
    --ink: #26241F;
    --ink-soft: #605A4E;
    --steel: #46586B;
    --steel-deep: #303E4C;
    --copper: #AD5A22;
    --copper-deep: #8B4718;
    --line: #C7BFAE;
    --line-soft: #D9D2C2;
    --danger: #A13B2C;
    --ok-bg: #EFE6D2;
    --radius: 14px;
    --shadow-soft: 0 2px 10px rgba(38,36,33,0.08);
    --font-ui: 'Zen Kaku Gothic New', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family: var(--font-ui);
    background: var(--paper);
    color: var(--ink);
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 28px 28px;
    background-attachment: fixed;
  }
  #app{
    max-width: 1180px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header{
    padding: 28px 28px 18px;
    border-bottom: 2px solid var(--ink);
    display:flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    flex-wrap: wrap;
    background: var(--paper);
  }
  .brand{
    display:flex;
    flex-direction: column;
    gap: 2px;
  }
  .brand .kanji{
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 0.04em;
  }
  .brand .sub{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
  }
  .header-actions{
    display:flex;
    gap: 10px;
    align-items: center;
  }
  .count-badge{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--steel-deep);
    border: 1px solid var(--line);
    padding: 6px 10px;
    border-radius: var(--radius);
    background: var(--paper-alt);
  }
  button{
    font-family: var(--font-ui);
    cursor: pointer;
    border: none;
  }
  .btn-primary{
    background: var(--copper);
    color: #FBF6EC;
    font-weight: 700;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: var(--radius);
    transition: background 0.15s ease;
  }
  .btn-primary:hover{ background: var(--copper-deep); }
  .btn-ghost{
    background: transparent;
    color: var(--steel-deep);
    border: 1px solid var(--line);
    font-size: 13px;
    padding: 8px 14px;
    border-radius: var(--radius);
    font-weight: 500;
  }
  .btn-ghost:hover{ border-color: var(--steel-deep); }
  .btn-ghost:disabled{
    opacity: 0.45;
    cursor: not-allowed;
    color: var(--ink-soft);
  }
  .btn-ghost:disabled:hover{ border-color: var(--line); }
  .btn-danger{
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    font-size: 13px;
    padding: 8px 14px;
    border-radius: var(--radius);
    font-weight: 500;
  }
  .btn-danger:hover{ background: var(--danger); color: #FBF6EC; }
  button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline: 2px solid var(--copper);
    outline-offset: 2px;
  }
  .inline-link-btn{
    background: transparent;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--steel-deep);
    font-size: 11px;
    padding: 3px 9px;
    margin-left: 8px;
  }
  .inline-link-btn:hover{ border-color: var(--steel-deep); background: var(--ok-bg); }
  .shared-note{
    font-size: 11px;
    color: var(--ink-soft);
    padding: 8px 28px;
    border-bottom: 1px solid var(--line-soft);
  }
  /* ---- デモ版の制限（お試し制限の1行と、上限に達したときの案内） ---- */
  .demo-limit-line{
    display: inline-block;
    margin-top: 4px;
    color: var(--copper-deep);
    font-weight: 700;
  }
  .modal-box.demo-stop{ max-width: 380px; }
  .demo-stop .modal-body{
    padding: 26px 24px 22px;
    text-align: center;
  }
  .demo-stop-icon{
    width: 84px;
    height: 84px;
    display: block;
    margin: 0 auto 10px;
    fill: none;
    stroke: var(--steel);
    stroke-width: 7;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  .demo-stop-title{
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }
  .demo-stop-text{
    font-size: 14px;
    line-height: 1.8;
    margin: 0 0 18px;
  }
  .demo-stop-text strong{ color: var(--copper-deep); }
  main{
    flex: 1;
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: 0;
  }
  .sidebar{
    border-right: 2px solid var(--ink);
    display:flex;
    flex-direction: column;
    background: var(--paper);
  }
  .search-hero{
    padding: 20px 16px;
    border-bottom: 2px solid var(--ink);
    background: var(--paper-alt);
  }
  .search-hero-title{
    font-size: 17px;
    font-weight: 900;
    margin-bottom: 14px;
  }
  .search-hero .field{ margin-bottom: 12px; }
  .search-hero .field:last-child{ margin-bottom: 0; }
  .search-hero label{
    display:block;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .search-hero select,
  .search-hero input[type=text]{
    width: 100%;
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #FBF8F1;
    color: var(--ink);
  }
  .search-hero input::placeholder{ color: #A79E8C; }
  .part-list{
    overflow-y: auto;
    flex: 1;
  }
  .part-row{
    width: 100%;
    text-align: left;
    padding: 12px 16px;
    background: transparent;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
  }
  .part-row-text{
    display:flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .row-manual-btn{
    flex-shrink: 0;
    background: var(--paper-alt);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-size: 15px;
    padding: 5px 8px;
    line-height: 1;
  }
  .row-manual-btn:hover{ background: var(--ok-bg); }
  .part-row.active .row-manual-btn{ background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }
  .list-legend{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 8px 16px;
    font-size: 12px;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--line-soft);
    background: var(--paper-alt);
  }
  .list-legend .legend-sample{
    display:inline-flex;
    cursor: default;
  }
  .part-row:hover{ background: var(--paper-alt); }
  .part-row.active{
    background: var(--steel-deep);
  }
  .part-row.active .p-number{ color: #E9D9C4; }
  .part-row.active .p-name{ color: #EDEAE2; }
  .p-number{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--copper-deep);
    font-weight: 600;
  }
  .p-name{
    font-size: 14px;
    font-weight: 500;
  }
  .empty-list{
    padding: 24px 16px;
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.7;
  }
  .content{
    padding: 28px;
    overflow-y: auto;
  }
  .placeholder{
    height: 100%;
    display:flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    gap: 14px;
    text-align:center;
  }
  .placeholder .mark{
    font-family: var(--font-mono);
    font-size: 44px;
    color: var(--line);
  }
  /* ---- Overview (PC向け：右側の余白に一覧表を表示) ---- */
  .overview-hint{
    color: var(--ink-soft);
    font-size: 13px;
    margin-bottom: 18px;
  }
  .overview-title{
    font-size: 15px;
    font-weight: 900;
    margin-bottom: 4px;
  }
  .overview-table-wrap{
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    background: #FBF8F1;
  }
  table.overview-table{
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .overview-table thead th{
    text-align: left;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    background: var(--paper-alt);
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  .overview-table tbody tr{
    cursor: pointer;
    border-bottom: 1px solid var(--line-soft);
  }
  .overview-table tbody tr:last-child{ border-bottom: none; }
  .overview-table tbody tr:hover{ background: var(--ok-bg); }
  .overview-table td{
    padding: 10px 14px;
    vertical-align: middle;
  }
  .overview-table td.ov-number{ font-family: var(--font-mono); color: var(--steel-deep); white-space: nowrap; }
  .overview-table td.ov-price{ font-family: var(--font-mono); text-align: right; white-space: nowrap; }
  .overview-table td.ov-manual{ text-align: center; width: 40px; }
  .overview-empty{
    padding: 40px 14px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
  }
  @media (max-width: 980px){
    .overview-table-wrap{ overflow-x: auto; }
  }
  /* ---- Detail card ---- */
  .card{
    background: #FBF8F1;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-soft);
  }
  .card-top{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 22px 24px;
    border-bottom: 1px solid var(--line);
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-top .p-number-lg{
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--copper-deep);
    font-weight: 600;
    letter-spacing: 0.03em;
  }
  .product-breadcrumb{
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .card-top h2{
    margin: 4px 0 0;
    font-size: 24px;
    font-weight: 700;
  }
  .price-tag{
    font-family: var(--font-mono);
    font-size: 26px;
    font-weight: 700;
    color: var(--steel-deep);
    background: var(--ok-bg);
    padding: 8px 16px;
    border-radius: var(--radius);
    white-space: nowrap;
  }
  .price-tag span{ font-size: 13px; font-weight: 500; margin-left: 4px; color: var(--ink-soft);}
  .card-actions{ display:flex; gap:8px; }
  .card-body{
    padding: 24px;
    display:grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 28px;
  }
  .section-label{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
    margin-bottom: 10px;
    display:block;
  }
  .photo-box{
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper-alt);
    aspect-ratio: 4/3;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow: hidden;
  }
  .photo-box img{ width:100%; height:100%; object-fit: cover; display:block; }
  .photo-box .no-photo{
    color: var(--ink-soft);
    font-size: 13px;
    text-align:center;
  }
  .photo-gallery{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .photo-thumb{
    width: 96px;
    height: 96px;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--line);
    cursor: pointer;
    flex-shrink: 0;
  }
  .photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .form-photo-thumb{
    position: relative;
    width: 84px;
    height: 84px;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--line);
    flex-shrink: 0;
  }
  .form-photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .form-photo-thumb .rm-photo{
    position:absolute;
    top: 2px; right: 2px;
    width: 20px; height: 20px;
    line-height: 18px;
    text-align:center;
    background: rgba(38,36,33,0.75);
    color: #fff;
    border-radius: 50%;
    font-size: 13px;
    padding: 0;
    border: none;
  }
  .photo-grid-form{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  table.comp-table{
    width:100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  table.comp-table th{
    text-align:left;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 500;
    border-bottom: 1px solid var(--line);
    padding: 6px 8px;
  }
  table.comp-table td{
    padding: 8px;
    border-bottom: 1px solid var(--line-soft);
  }
  table.comp-table td.qty{
    font-family: var(--font-mono);
    white-space: nowrap;
    color: var(--steel-deep);
  }
  .no-comp{ font-size: 13px; color: var(--ink-soft); }
  .pdf-chip{
    display:inline-flex;
    align-items:center;
    gap: 8px;
    margin-top: 12px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper-alt);
    font-size: 13px;
    color: var(--steel-deep);
  }
  .pdf-chip button{
    background: var(--steel-deep);
    color: #EDEAE2;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: var(--radius);
    font-weight: 500;
  }
  .pdf-chip button:hover{ background: var(--copper); }
  .no-pdf{ font-size: 13px; color: var(--ink-soft); margin-top: 12px; }
  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(38,36,33,0.72);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 1000;
    padding: 24px;
  }
  .modal-box{
    background: #FBF8F1;
    border-radius: var(--radius);
    width: 100%;
    max-width: 560px;
    max-height: 85vh;
    display:flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(38,36,33,0.28);
  }
  .modal-box.wide{ max-width: 760px; }
  .modal-top{
    display:flex;
    justify-content: space-between;
    align-items:center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    gap: 10px;
  }
  .modal-top h3{ margin:0; font-size:16px; }
  .modal-body{
    padding: 16px 20px;
    overflow-y: auto;
  }
  .map-add-row{
    display:grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
    margin-bottom: 16px;
  }
  .map-add-row input{
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #FFFDF8;
    font-size: 13px;
  }
  .map-add-row input.mono{ font-family: var(--font-mono); }
  .map-list{
    display:flex;
    flex-direction: column;
    gap: 6px;
  }
  .map-row{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 8px 10px;
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    background: var(--paper-alt);
  }
  .map-row .code{
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--copper-deep);
    font-weight: 600;
    min-width: 80px;
  }
  .map-row .prod{ flex:1; font-size: 13px; }
  .map-row button{
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
    font-size: 11px;
    padding: 4px 8px;
    border-radius: var(--radius);
  }
  .map-row button:hover{ background: var(--danger); color: #FBF6EC; }
  .map-row button.row-open-btn{
    border-color: var(--steel-deep);
    color: var(--steel-deep);
  }
  .map-row button.row-open-btn:hover{ background: var(--steel-deep); color: #EDEAE2; }
  .map-empty{ font-size: 13px; color: var(--ink-soft); }
  .auto-fill-note{
    font-size: 11px;
    color: var(--steel-deep);
    margin-top: 4px;
  }
  .notes-block{
    grid-column: 1 / -1;
    border-top: 1px solid var(--line);
    padding-top: 16px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
  }
  .confirm-bar{
    grid-column: 1/-1;
    background: #F6E7E1;
    border: 1px solid var(--danger);
    border-radius: var(--radius);
    padding: 12px 16px;
    display:flex;
    justify-content: space-between;
    align-items:center;
    font-size: 13px;
    flex-wrap: wrap;
    gap: 10px;
  }
  /* ---- Form ---- */
  .form-wrap{ max-width: 720px; }
  .form-wrap h2{ margin-top:0; }
  .field{ margin-bottom: 18px; }
  .field label{
    display:block;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .field input[type=text], .field input[type=number], .field textarea{
    width:100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #FBF8F1;
    font-family: var(--font-ui);
    font-size: 14px;
    color: var(--ink);
  }
  .field.mono input{ font-family: var(--font-mono); }
  .field textarea{ resize: vertical; min-height: 70px; }
  .two-col{ display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .comp-row{
    display:grid;
    grid-template-columns: 1fr 110px 34px;
    gap: 8px;
    margin-bottom: 8px;
  }
  .comp-row input{
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #FBF8F1;
    font-size: 13px;
  }
  .comp-row .rm{
    background: transparent;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--danger);
    font-size: 16px;
    line-height: 1;
  }
  .add-row-btn{
    font-size: 12px;
    color: var(--steel-deep);
    background: transparent;
    border: 1px dashed var(--line);
    padding: 7px 12px;
    border-radius: var(--radius);
    width: 100%;
  }
  .photo-input-box{
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 16px;
    text-align:center;
    background: var(--paper-alt);
  }
  .photo-preview{
    max-width: 220px;
    border-radius: var(--radius);
    display:block;
    margin: 10px auto 0;
  }
  .pdf-input-box{
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 16px;
    background: var(--paper-alt);
  }
  .pdf-current{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
    background: #FBF8F1;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 12px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .pdf-current button{
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
    font-size: 12px;
    padding: 5px 10px;
    border-radius: var(--radius);
  }
  .pdf-current button:hover{ background: var(--danger); color: #FBF6EC; }
  .form-actions{
    display:flex;
    gap: 10px;
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .status-msg{
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 8px;
    font-family: var(--font-mono);
  }
  .status-msg.err{ color: var(--danger); }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap: 6px;
    font-size: 15px;
    color: var(--steel-deep);
    background: var(--paper-alt);
    border: 1px solid var(--line);
    padding: 10px 18px;
    margin-bottom: 16px;
    border-radius: var(--radius);
    font-weight: 700;
  }
  .back-link:hover{ background: var(--ok-bg); border-color: var(--steel-deep); }
  @media (max-width: 760px){
    header{ padding: 18px 14px 14px; gap: 12px; }
    .brand .kanji{ font-size: 26px; }
    .brand .sub{ font-size: 10px; }
    .header-actions{ gap: 6px; flex-wrap: wrap; }
    .header-actions .count-badge,
    .header-actions button{ white-space: nowrap; }
    .count-badge{ font-size: 11px; padding: 6px 8px; }
    .btn-ghost{ font-size: 12px; padding: 8px 10px; }
    .btn-primary{ font-size: 13px; padding: 9px 14px; }
    .shared-note{ padding: 8px 14px; }
    .content{ padding: 18px 14px; }
    main{ grid-template-columns: 1fr; }
    /* 一覧はページ全体と一緒にスクロールさせる（枠内スクロールだと数件しか見えない） */
    .sidebar{ border-right:none; border-bottom: 2px solid var(--ink); max-height: none; }
    .part-list{ overflow-y: visible; flex: none; }
    .card-body{ grid-template-columns: 1fr; }
    #app.detail-active .sidebar{ display:none; }
    #app:not(.detail-active) .content{ display:none; }
    .back-link{ display:inline-block; }
  }
</style>
</head>

<script>
/* =====================================================================
   保存レイヤー（ブラウザ内保存 / IndexedDB）
   window.storage と同じ形にしてあるので、社内共有ファイル版に
   差し替えるときは、このブロックだけを入れ替えれば済む。
   ===================================================================== */
const DB_NAME = 'parts-ledger';
const DB_STORE = 'kv';
let _dbPromise = null;
let _idbOk = null;          // null = 未判定 / true = IndexedDB / false = メモリのみ
const _mem = new Map();     // IndexedDB が使えない環境（プレビュー等）の退避先

/* ---- デモ版の制限 ----
   DEMO_NO_SAVE   : true のあいだはブラウザに保存せず、メモリだけで動かす。
                    ページを開き直すと、毎回デモデータ（最初の24件）から始まる。
   DEMO_NEW_LIMIT : 新規登録できる件数（CSVインポートの新規分も含む）。
   本番版にするときは DEMO_NO_SAVE = false、DEMO_NEW_LIMIT = Infinity にする。 */
const DEMO_NO_SAVE = true;
const DEMO_NEW_LIMIT = 3;
let demoNewCount = 0;       // このページを開いてから新規登録した件数

function openDb(){
  if(_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    if(typeof indexedDB === 'undefined'){ reject(new Error('no indexedDB')); return; }
    let req;
    try{ req = indexedDB.open(DB_NAME, 1); }catch(e){ reject(e); return; }
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('indexedDB open failed'));
    req.onblocked = () => reject(new Error('indexedDB blocked'));
  });
  return _dbPromise;
}

async function idbUsable(){
  if(DEMO_NO_SAVE){ _idbOk = false; return false; }   // デモ版：保存しない
  if(_idbOk !== null) return _idbOk;
  try{ await openDb(); _idbOk = true; }
  catch(e){ _idbOk = false; }
  return _idbOk;
}

async function idbRun(mode, fn){
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, mode);
    const req = fn(tx.objectStore(DB_STORE));
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

const appStorage = {
  async get(key){
    if(await idbUsable()){
      const v = await idbRun('readonly', st => st.get(key));
      return (v === undefined) ? null : { key, value: v };
    }
    return _mem.has(key) ? { key, value: _mem.get(key) } : null;
  },
  async set(key, value){
    if(await idbUsable()) await idbRun('readwrite', st => st.put(value, key));
    else _mem.set(key, value);
    return { key, value };
  },
  async delete(key){
    if(await idbUsable()) await idbRun('readwrite', st => st.delete(key));
    else _mem.delete(key);
    return { key, deleted: true };
  },
  async list(prefix){
    const keys = (await idbUsable())
      ? await idbRun('readonly', st => st.getAllKeys())
      : Array.from(_mem.keys());
    return { keys: prefix ? keys.filter(k => String(k).startsWith(prefix)) : keys };
  },
  async clearAll(){
    if(await idbUsable()) await idbRun('readwrite', st => st.clear());
    else _mem.clear();
  },
  async isPersistent(){ return await idbUsable(); }
};

const STORAGE_SHARED = true;
let partsIndex = [];      // [{id, partNumber, name, price}]
let filteredIndex = [];
let productMap = {};      // { "L-15": "視野計", ... } 品番(正規化済み) -> 製品名
let selectedId = null;
let mode = 'empty';       // empty | detail | form
let selectedProduct = null;  // null = すべて
let editingPart = null;   // full record when editing, or {} for new
let confirmDeleteId = null;
let loadError = '';

const appEl = document.getElementById('app');
const listEl = document.getElementById('partList');
const searchAllEl = document.getElementById('searchAll');
const productSelectEl = document.getElementById('productSelect');
const contentEl = document.getElementById('content');
const countBadge = document.getElementById('countBadge');

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function yen(n){
  const num = Number(n);
  if(isNaN(num)) return '—';
  return num.toLocaleString('ja-JP');
}
function uid(){
  return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
}

async function loadIndex(){
  try{
    const res = await appStorage.get('parts:index', STORAGE_SHARED);
    partsIndex = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    partsIndex = [];
  }
  applyFilter();
}

function normalizeCode(s){
  return (s || '').trim().toUpperCase();
}

async function loadProductMap(){
  try{
    const res = await appStorage.get('product-map', STORAGE_SHARED);
    productMap = res && res.value ? JSON.parse(res.value) : {};
  }catch(e){
    productMap = {};
  }
}

async function saveProductMap(){
  await appStorage.set('product-map', JSON.stringify(productMap), STORAGE_SHARED);
}

function lookupProduct(code){
  const key = normalizeCode(code);
  return key && productMap[key] ? productMap[key] : null;
}

async function saveIndex(){
  await appStorage.set('parts:index', JSON.stringify(partsIndex), STORAGE_SHARED);
}

async function loadPart(id){
  const res = await appStorage.get('part:' + id, STORAGE_SHARED);
  return res && res.value ? JSON.parse(res.value) : null;
}

async function loadPartPhotos(part){
  const photos = [];
  if(part.photoIds && part.photoIds.length){
    for(const pid of part.photoIds){
      try{
        const res = await appStorage.get('part-photo:' + pid, STORAGE_SHARED);
        if(res && res.value) photos.push({ id: pid, data: res.value, legacy: false });
      }catch(e){ /* skip missing photo */ }
    }
  }else if(part.photo){
    photos.push({ id: 'legacy', data: part.photo, legacy: true });
  }
  return photos;
}

function upsertIndexEntry(part){
  const idx = partsIndex.findIndex(p => p.id === part.id);
  const rec = { id: part.id, partNumber: part.partNumber, name: part.name, price: part.price, product: part.product || '', hasPhoto: !!(part.photoIds && part.photoIds.length) || !!part.photo, hasManualPdf: !!part.hasManualPdf };
  if(idx >= 0) partsIndex[idx] = rec; else partsIndex.push(rec);
}

async function savePart(part){
  await appStorage.set('part:' + part.id, JSON.stringify(part), STORAGE_SHARED);
  upsertIndexEntry(part);
  partsIndex.sort((a,b) => a.partNumber.localeCompare(b.partNumber, 'ja'));
  await saveIndex();
}

async function deletePartById(id){
  try{ await appStorage.delete('part:' + id, STORAGE_SHARED); }catch(e){}
  try{ await deleteChunkedFile('part-pdf', id); }catch(e){}
  try{ await deleteChunkedFile('part-calib', id); }catch(e){}
  try{ await deleteChunkedFile('part-manual', id); }catch(e){}
  partsIndex = partsIndex.filter(p => p.id !== id);
  await saveIndex();
}

const MAX_PDF_BYTES = 15 * 1024 * 1024; // 15MB (大きめの資料も入るようチャンク分割して保存する)
const CHUNK_SIZE = 3000000; // 1チャンクあたりの文字数(base64後、1保存キー5MB上限に余裕を持たせる)

async function saveChunkedFile(keyPrefix, id, name, dataUrl){
  const chunkCount = Math.ceil(dataUrl.length / CHUNK_SIZE) || 1;
  for(let i = 0; i < chunkCount; i++){
    const chunk = dataUrl.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
    await appStorage.set(`${keyPrefix}-chunk:${id}:${i}`, chunk, STORAGE_SHARED);
  }
  await appStorage.set(`${keyPrefix}:${id}`, JSON.stringify({ name, chunkCount }), STORAGE_SHARED);
}

async function loadChunkedFile(keyPrefix, id){
  const res = await appStorage.get(`${keyPrefix}:${id}`, STORAGE_SHARED);
  if(!res || !res.value) return null;
  const meta = JSON.parse(res.value);
  let dataUrl = '';
  for(let i = 0; i < meta.chunkCount; i++){
    const chunkRes = await appStorage.get(`${keyPrefix}-chunk:${id}:${i}`, STORAGE_SHARED);
    if(!chunkRes || !chunkRes.value) throw new Error('ファイルの一部が見つかりませんでした');
    dataUrl += chunkRes.value;
  }
  return { name: meta.name, data: dataUrl };
}

async function deleteChunkedFile(keyPrefix, id){
  let meta = null;
  try{
    const res = await appStorage.get(`${keyPrefix}:${id}`, STORAGE_SHARED);
    if(res && res.value) meta = JSON.parse(res.value);
  }catch(e){ /* 元々存在しない場合はそのまま無視 */ }
  if(meta){
    for(let i = 0; i < meta.chunkCount; i++){
      try{ await appStorage.delete(`${keyPrefix}-chunk:${id}:${i}`, STORAGE_SHARED); }catch(e){}
    }
  }
  try{ await appStorage.delete(`${keyPrefix}:${id}`, STORAGE_SHARED); }catch(e){}
}
const DOC_ACCEPT = ".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.txt,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,text/csv,text/plain";
const DOC_EXTENSIONS = ['.pdf','.doc','.docx','.xls','.xlsx','.ppt','.pptx','.csv','.txt'];

function isAllowedDocFile(file){
  const lower = file.name.toLowerCase();
  return DOC_EXTENSIONS.some(ext => lower.endsWith(ext));
}

function fileIcon(filename){
  const lower = (filename || '').toLowerCase();
  if(lower.endsWith('.pdf')) return '📄';
  if(lower.endsWith('.xls') || lower.endsWith('.xlsx') || lower.endsWith('.csv')) return '📊';
  if(lower.endsWith('.doc') || lower.endsWith('.docx') || lower.endsWith('.txt')) return '📝';
  if(lower.endsWith('.ppt') || lower.endsWith('.pptx')) return '📽️';
  return '📎';
}

function readFileAsDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function dataUrlToBlob(dataUrl){
  const [head, base64] = dataUrl.split(',');
  const mime = head.match(/:(.*?);/)[1];
  const bin = atob(base64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

// ---- CSV一括インポート ----
let csvState = { file: null, encoding: 'shift-jis', headers: [], rows: [], mapping: { partNumber: -1, name: -1, price: -1, product: -1 } };

function resetCsvState(){
  csvState = { file: null, encoding: 'shift-jis', headers: [], rows: [], mapping: { partNumber: -1, name: -1, price: -1, product: -1 } };
}

function parseCsvText(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      }else{ field += c; }
    }else{
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(c === '\r'){ /* skip */ }
      else{ field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(cell => cell.trim() !== ''));
}

function guessColumn(headers, keywords){
  for(let i = 0; i < headers.length; i++){
    const h = headers[i].toLowerCase();
    if(keywords.some(k => h.includes(k))) return i;
  }
  return -1;
}

async function handleCsvFile(file){
  csvState.file = file;
  await reparseCsvFile();
}

async function reparseCsvFile(){
  if(!csvState.file) return;
  const status = document.getElementById('csvStatus');
  try{
    const buf = await csvState.file.arrayBuffer();
    const decoder = new TextDecoder(csvState.encoding);
    const text = decoder.decode(buf);
    const allRows = parseCsvText(text);
    if(allRows.length < 1){
      csvState.headers = []; csvState.rows = [];
      if(status){ status.textContent = 'CSVの内容を読み取れませんでした。'; status.className = 'status-msg err'; }
      renderCsvBody();
      return;
    }
    csvState.headers = allRows[0].map(h => h.trim());
    csvState.rows = allRows.slice(1);
    csvState.mapping.partNumber = guessColumn(csvState.headers, ['品番','部品番号','code','part']);
    csvState.mapping.name = guessColumn(csvState.headers, ['品名','名称','部品名','name']);
    csvState.mapping.price = guessColumn(csvState.headers, ['単価','価格','金額','price']);
    csvState.mapping.product = guessColumn(csvState.headers, ['製品名','製品','product']);
    renderCsvBody();
  }catch(e){
    if(status){ status.textContent = 'CSVの読み込みに失敗しました。文字コードを変えて試してください。'; status.className = 'status-msg err'; }
  }
}

function getMappedValue(row, key){
  const idx = csvState.mapping[key];
  if(idx === -1 || idx === undefined || idx === null) return '';
  return row[idx] !== undefined ? row[idx].toString().trim() : '';
}

function csvSelectOptions(includeNone){
  const opts = csvState.headers.map((h,i) => `<option value="${i}">${escapeHtml(h || ('列' + (i+1)))}</option>`);
  return (includeNone ? [`<option value="-1">使用しない</option>`] : []).concat(opts).join('');
}

  document.getElementById('mapProduct').addEventListener('change', (e) => { csvState.mapping.product = Number(e.target.value); renderCsvBody(); });

async function runCsvImport(){
  const status = document.getElementById('csvStatus');
  const importBtn = document.getElementById('csvImportBtn');
  if(csvState.mapping.partNumber === -1 || csvState.mapping.name === -1){
    status.textContent = '品番と品名の列は必ず選択してください。';
    status.className = 'status-msg err';
    return;
  }
  importBtn.disabled = true;
  const byNumber = {};
  partsIndex.forEach(p => { byNumber[(p.partNumber || '').trim()] = p.id; });

  let added = 0, updated = 0, skipped = 0, limited = 0;
  for(let i = 0; i < csvState.rows.length; i++){
    const row = csvState.rows[i];
    const partNumber = getMappedValue(row, 'partNumber');
    if(!partNumber){ skipped++; continue; }
    const name = getMappedValue(row, 'name');
    const priceStr = getMappedValue(row, 'price').replace(/[^0-9.\-]/g, '');
    const priceNum = priceStr === '' ? null : Number(priceStr);
    const product = getMappedValue(row, 'product');

    status.textContent = `処理中… (${i+1}/${csvState.rows.length})`;

    if(byNumber[partNumber]){
      const existing = await loadPart(byNumber[partNumber]);
      if(existing){
        existing.name = name || existing.name;
        if(priceStr !== '' && !isNaN(priceNum)) existing.price = priceNum;
        if(product) existing.product = product;
        await appStorage.set('part:' + existing.id, JSON.stringify(existing), STORAGE_SHARED);
        upsertIndexEntry(existing);
        updated++;
      }else{ skipped++; }
    }else if(demoLimitReached()){
      limited++;   // デモ版：上限を超えた新規分は登録しない
    }else{
      const rec = {
        id: uid(), partNumber, name,
        price: (priceStr !== '' && !isNaN(priceNum)) ? priceNum : null,
        product, composition: [], notes: '', photoIds: [], hasPdf: false, pdfName: ''
      };
      await appStorage.set('part:' + rec.id, JSON.stringify(rec), STORAGE_SHARED);
      upsertIndexEntry(rec);
      byNumber[partNumber] = rec.id;
      added++;
      demoNewCount++;
    }
  }
  partsIndex.sort((a,b) => a.partNumber.localeCompare(b.partNumber, 'ja'));
  await saveIndex();
  applyFilter();
  importBtn.disabled = false;
  status.textContent = `完了しました。新規登録 ${added} 件／更新 ${updated} 件／スキップ ${skipped} 件`
    + (limited ? `／デモ版の上限で登録しなかった分 ${limited} 件` : '');
  status.className = 'status-msg';
  if(limited) showDemoLimitModal();
}

        <span class="p-number">${escapeHtml(p.partNumber)}</span>
        <span class="p-name">${escapeHtml(p.name)}</span>
      </div>
      ${p.hasManualPdf ? `<button class="row-manual-btn" data-id="${p.id}" data-number="${escapeHtml(p.partNumber)}" title="手順書を見る">📘</button>` : ''}
    </div>
  `).join('');
  listEl.querySelectorAll('.part-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if(e.target.closest('.row-manual-btn')) return;
      selectPart(row.dataset.id);
    });
    row.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); selectPart(row.dataset.id); }
    });
  });
  listEl.querySelectorAll('.row-manual-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openPartManual(btn.dataset.id, btn.dataset.number);
    });
  });
}

async function selectPart(id){
  selectedId = id;
  mode = 'detail';
  confirmDeleteId = null;
  appEl.classList.add('detail-active');
  renderList();
  contentEl.innerHTML = `<div class="placeholder"><div class="mark">···</div><div>読み込み中です</div></div>`;
  const part = await loadPart(id);
  if(selectedId !== id) return; // stale
  if(!part){
    contentEl.innerHTML = `<div class="placeholder"><div class="mark">!</div><div>データが見つかりませんでした</div></div>`;
    return;
  }
  const photos = await loadPartPhotos(part);
  if(selectedId !== id) return; // stale
  renderDetail(part, photos);
}

async function openForm(existing){
  mode = 'form';
  appEl.classList.add('detail-active');
  const newEditing = existing ? JSON.parse(JSON.stringify(existing)) : {
    id: uid(), partNumber: '', name: '', price: '', product: '', composition: [], notes: '', photoIds: [],
    hasPdf: false, pdfName: '', hasCalibPdf: false, calibPdfName: '', hasManualPdf: false, manualPdfName: ''
  };
  newEditing._pdfPending = null;   // { name, data } when a new/changed PDF is chosen but not yet saved
  newEditing._pdfRemoved = false;  // true if user removed an existing PDF
  newEditing._calibPending = null;
  newEditing._calibRemoved = false;
  newEditing._manualPending = null;
  newEditing._manualRemoved = false;
  newEditing._newPhotos = [];        // [{id, data}] newly chosen photos, not yet saved
  newEditing._removedPhotoIds = [];  // ids of existing photos marked for removal
  newEditing._legacyPhotoRemoved = false;
  editingPart = newEditing;
  contentEl.innerHTML = `<div class="placeholder"><div class="mark">···</div><div>読み込み中です</div></div>`;
  const photos = existing ? await loadPartPhotos(existing) : [];
  if(editingPart !== newEditing || mode !== 'form') return; // superseded by a newer call
  newEditing._existingPhotos = photos;
  renderForm();
}

function photoGridHtml(){
  const p = editingPart;
  const existing = (p._existingPhotos || []).filter(ph => {
    if(ph.legacy) return !p._legacyPhotoRemoved;
    return !p._removedPhotoIds.includes(ph.id);
  });
  const pending = p._newPhotos || [];
  if(existing.length === 0 && pending.length === 0) return '';
  const existingHtml = existing.map(ph => `
    <div class="form-photo-thumb"><img src="${ph.data}"><button type="button" class="rm-photo" data-kind="existing" data-id="${ph.id}">×</button></div>
  `).join('');
  const pendingHtml = pending.map(ph => `
    <div class="form-photo-thumb"><img src="${ph.data}"><button type="button" class="rm-photo" data-kind="pending" data-id="${ph.id}">×</button></div>
  `).join('');
  return `<div class="photo-grid-form">${existingHtml}${pendingHtml}</div>`;
}

function syncFieldsFromDom(){
  const pn = document.getElementById('f-partNumber');
  const nm = document.getElementById('f-name');
  const pr = document.getElementById('f-price');
  const pd = document.getElementById('f-product');
  const nt = document.getElementById('f-notes');
  if(pn) editingPart.partNumber = pn.value;
  if(nm) editingPart.name = nm.value;
  if(pr) editingPart.price = pr.value;
  if(pd) editingPart.product = pd.value;
  if(nt) editingPart.notes = nt.value;
  if(document.getElementById('compRows')) editingPart.composition = readCompRows();
}

function compRowHtml(c, i){
  return `
    <div class="comp-row" data-idx="${i}">
      <input type="text" class="comp-name" autocomplete="off" value="${escapeHtml(c.name)}" placeholder="部品名">
      <input type="text" class="comp-qty" autocomplete="off" value="${escapeHtml(c.qty)}" placeholder="数量（例: 2個）">
      <button type="button" class="rm" data-idx="${i}">×</button>
    </div>
  `;
}

function readCompRows(){
  return Array.from(document.querySelectorAll('#compRows .comp-row')).map(row => ({
    name: row.querySelector('.comp-name').value.trim(),
    qty: row.querySelector('.comp-qty').value.trim()
  }));
}

// delegate remove-row clicks (rows are re-rendered each time so bind after render)
document.addEventListener('click', (e) => {
  if(e.target.classList.contains('rm') && mode === 'form'){
    syncFieldsFromDom();
    const rows = editingPart.composition;
    const idx = Number(e.target.dataset.idx);
    rows.splice(idx, 1);
    editingPart.composition = rows.length ? rows : [{name:'', qty:''}];
    renderForm();
  }
});

function compressImage(file, maxWidth, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function onSaveForm(){
  const status = document.getElementById('formStatus');
  const partNumber = document.getElementById('f-partNumber').value.trim();
  const name = document.getElementById('f-name').value.trim();
  const priceRaw = document.getElementById('f-price').value.trim();
  const product = document.getElementById('f-product').value.trim();
  const notes = document.getElementById('f-notes').value.trim();
  const composition = editingPart.composition || [];

  if(!partNumber || !name){
    status.textContent = '品番と品名は必須です。';
    status.className = 'status-msg err';
    return;
  }
  const price = priceRaw === '' ? null : Number(priceRaw);
  if(priceRaw !== '' && isNaN(price)){
    status.textContent = '単価は数値で入力してください。';
    status.className = 'status-msg err';
    return;
  }
  // デモ版：新規登録の上限（編集は何度でもOK）
  const isNewPart = !partsIndex.some(p => p.id === editingPart.id);
  if(isNewPart && demoLimitReached()){
    showDemoLimitModal();
    return;
  }

  let hasPdf = editingPart.hasPdf && !editingPart._pdfRemoved;
  let pdfName = hasPdf ? editingPart.pdfName : '';
  if(editingPart._pdfPending){ hasPdf = true; pdfName = editingPart._pdfPending.name; }

  let hasCalibPdf = editingPart.hasCalibPdf && !editingPart._calibRemoved;
  let calibPdfName = hasCalibPdf ? editingPart.calibPdfName : '';
  if(editingPart._calibPending){ hasCalibPdf = true; calibPdfName = editingPart._calibPending.name; }

  let hasManualPdf = editingPart.hasManualPdf && !editingPart._manualRemoved;
  let manualPdfName = hasManualPdf ? editingPart.manualPdfName : '';
  if(editingPart._manualPending){ hasManualPdf = true; manualPdfName = editingPart._manualPending.name; }

  // 写真: 既存(残すもの) + 新規追加分のIDリストを組み立てる。旧形式の単一写真は新形式へ移行する。
  const keptExistingIds = (editingPart._existingPhotos || [])
    .filter(ph => !ph.legacy && !editingPart._removedPhotoIds.includes(ph.id))
    .map(ph => ph.id);
  const newPhotoIds = (editingPart._newPhotos || []).map(ph => ph.id);
  let finalPhotoIds = keptExistingIds.concat(newPhotoIds);
  let legacyMigrationId = null;
  const legacyPhoto = (editingPart._existingPhotos || []).find(ph => ph.legacy);
  if(legacyPhoto && !editingPart._legacyPhotoRemoved){
    legacyMigrationId = uid();
    finalPhotoIds = [legacyMigrationId].concat(finalPhotoIds);
  }

  const record = {
    id: editingPart.id,
    partNumber, name, price, product,
    composition, notes,
    photoIds: finalPhotoIds,
    hasPdf, pdfName,
    hasCalibPdf, calibPdfName,
    hasManualPdf, manualPdfName
  };

  status.textContent = '保存しています…';
  status.className = 'status-msg';
  try{
    if(editingPart._pdfPending){
      status.textContent = 'ファイルを保存しています…';
      await saveChunkedFile('part-pdf', record.id, editingPart._pdfPending.name, editingPart._pdfPending.data);
    }else if(editingPart._pdfRemoved){
      await deleteChunkedFile('part-pdf', record.id);
    }
    if(editingPart._calibPending){
      status.textContent = 'ファイルを保存しています…';
      await saveChunkedFile('part-calib', record.id, editingPart._calibPending.name, editingPart._calibPending.data);
    }else if(editingPart._calibRemoved){
      await deleteChunkedFile('part-calib', record.id);
    }
    if(editingPart._manualPending){
      status.textContent = 'ファイルを保存しています…';
      await saveChunkedFile('part-manual', record.id, editingPart._manualPending.name, editingPart._manualPending.data);
    }else if(editingPart._manualRemoved){
      await deleteChunkedFile('part-manual', record.id);
    }
    if(legacyMigrationId){
      await appStorage.set('part-photo:' + legacyMigrationId, legacyPhoto.data, STORAGE_SHARED);
    }
    for(const ph of (editingPart._newPhotos || [])){
      await appStorage.set('part-photo:' + ph.id, ph.data, STORAGE_SHARED);
    }
    for(const rid of (editingPart._removedPhotoIds || [])){
      try{ await appStorage.delete('part-photo:' + rid, STORAGE_SHARED); }catch(e){}
    }
    await savePart(record);
    if(isNewPart) demoNewCount++;
    selectedId = record.id;
    mode = 'detail';
    applyFilter();
    selectPart(record.id);
  }catch(e){
    status.textContent = `保存に失敗しました：${(e && e.name) || 'Error'} - ${(e && e.message) || e}`;
    status.className = 'status-msg err';
  }
}

const DEMO_VERSION = 'okuba-4';  // サンプルを変更したらここを更新する（okuba-4：M-3001 に構成表・手順書・写真を追加）

async function seedDemoData(){
  let existing = null, ver = null;
  try{ existing = await appStorage.get('parts:index', STORAGE_SHARED); }catch(e){}
  try{ ver = await appStorage.get('demo:version', STORAGE_SHARED); }catch(e){}
  const sameVersion = ver && ver.value === DEMO_VERSION;
  if(existing && existing.value && sameVersion) return;
  // 旧いサンプルが残っている場合は入れ替える
  if(existing && existing.value && !sameVersion) await appStorage.clearAll();

  const index = [];
  for(const r of DEMO_ROWS){
    const id = uid();
    const photoIds = [];
    if(DEMO_PHOTOS[r.pn]){
      const pid = uid();
      await appStorage.set('part-photo:' + pid, demoSvg(DEMO_PHOTOS[r.pn]), STORAGE_SHARED);
      photoIds.push(pid);
    }
    // 添付ファイルのサンプル（DEMO_DOCS にある部品だけ。今は M-3001 の構成表・手順書）
    const docs = (typeof DEMO_DOCS !== 'undefined' && DEMO_DOCS[r.pn]) || {};
    if(docs.calib)  await saveChunkedFile('part-calib',  id, docs.calib.name,  docs.calib.data);
    if(docs.manual) await saveChunkedFile('part-manual', id, docs.manual.name, docs.manual.data);
    const rec = {
      id: id, partNumber: r.pn, name: r.name, price: r.price, product: r.product,
      composition: r.comp || [], notes: r.notes || '', photoIds: photoIds,
      hasPdf:false, pdfName:'',
      hasCalibPdf: !!docs.calib,   calibPdfName:  docs.calib  ? docs.calib.name  : '',
      hasManualPdf: !!docs.manual, manualPdfName: docs.manual ? docs.manual.name : ''
    };
    await appStorage.set('part:' + id, JSON.stringify(rec), STORAGE_SHARED);
    index.push({ id: id, partNumber: rec.partNumber, name: rec.name, price: rec.price, product: rec.product, hasPhoto: photoIds.length > 0, hasManualPdf: !!docs.manual });
  }
  index.sort(function(a,b){ return a.partNumber.localeCompare(b.partNumber, 'ja'); });
  await appStorage.set('parts:index', JSON.stringify(index), STORAGE_SHARED);

  const map = {};
  DEMO_ROWS.forEach(function(r){ map[normalizeCode(r.pn)] = r.product; });
  await appStorage.set('product-map', JSON.stringify(map), STORAGE_SHARED);
  await appStorage.set('demo:version', DEMO_VERSION, STORAGE_SHARED);
}

function demoLimitReached(){
  return demoNewCount >= DEMO_NEW_LIMIT;

function closeDemoLimitModal(){
  const overlay = document.getElementById('demoLimitOverlay');
  if(overlay) overlay.remove();
  document.removeEventListener('keydown', onDemoLimitKey);
}

function onDemoLimitKey(e){
  if(e.key === 'Escape') closeDemoLimitModal();
}

  overlay.className = 'modal-overlay';

  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeDemoLimitModal(); });

}
