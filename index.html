<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>部品台帳</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#303E4C">
  <meta name="apple-mobile-web-app-title" content="部品台帳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDEAE2;
    --paper-alt: #E1DCCE;
    --ink: #26241F;
    --ink-soft: #605A4E;
    --steel: #46586B;
    --steel-deep: #303E4C;
    --copper: #AD5A22;
    --copper-deep: #8B4718;
    --line: #C7BFAE;
    --line-soft: #D9D2C2;
    --danger: #A13B2C;
    --ok-bg: #EFE6D2;
    --radius: 14px;
    --shadow-soft: 0 2px 10px rgba(38,36,33,0.08);
    --font-ui: 'Zen Kaku Gothic New', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family: var(--font-ui);
    background: var(--paper);
    color: var(--ink);
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 28px 28px;
    background-attachment: fixed;
  }
  #app{
    max-width: 1180px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header{
    padding: 28px 28px 18px;
    border-bottom: 2px solid var(--ink);
    display:flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    flex-wrap: wrap;
    background: var(--paper);
  }
  .brand{
    display:flex;
    flex-direction: column;
    gap: 2px;
  }
  .brand .kanji{
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 0.04em;
  }
  .brand .sub{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
  }
  .header-actions{
    display:flex;
    gap: 10px;
    align-items: center;
  }
  .count-badge{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--steel-deep);
    border: 1px solid var(--line);
    padding: 6px 10px;
    border-radius: var(--radius);
    background: var(--paper-alt);
  }
  button{
    font-family: var(--font-ui);
    cursor: pointer;
    border: none;
  }
  .btn-primary{
    background: var(--copper);
    color: #FBF6EC;
    font-weight: 700;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: var(--radius);
    transition: background 0.15s ease;
  }
  .btn-primary:hover{ background: var(--copper-deep); }
  .btn-ghost{
    background: transparent;
    color: var(--steel-deep);
    border: 1px solid var(--line);
    font-size: 13px;
    padding: 8px 14px;
    border-radius: var(--radius);
    font-weight: 500;
  }
  .btn-ghost:hover{ border-color: var(--steel-deep); }
  .btn-ghost:disabled{
    opacity: 0.45;
    cursor: not-allowed;
    color: var(--ink-soft);
  }
  .btn-ghost:disabled:hover{ border-color: var(--line); }
  .btn-danger{
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    font-size: 13px;
    padding: 8px 14px;
    border-radius: var(--radius);
    font-weight: 500;
  }
  .btn-danger:hover{ background: var(--danger); color: #FBF6EC; }
  button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline: 2px solid var(--copper);
    outline-offset: 2px;
  }
  .inline-link-btn{
    background: transparent;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--steel-deep);
    font-size: 11px;
    padding: 3px 9px;
    margin-left: 8px;
  }
  .inline-link-btn:hover{ border-color: var(--steel-deep); background: var(--ok-bg); }
  .shared-note{
    font-size: 11px;
    color: var(--ink-soft);
    padding: 8px 28px;
    border-bottom: 1px solid var(--line-soft);
  }
  main{
    flex: 1;
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: 0;
  }
  .sidebar{
    border-right: 2px solid var(--ink);
    display:flex;
    flex-direction: column;
    background: var(--paper);
  }
  .search-hero{
    padding: 20px 16px;
    border-bottom: 2px solid var(--ink);
    background: var(--paper-alt);
  }
  .search-hero-title{
    font-size: 17px;
    font-weight: 900;
    margin-bottom: 14px;
  }
  .search-hero .field{ margin-bottom: 12px; }
  .search-hero .field:last-child{ margin-bottom: 0; }
  .search-hero label{
    display:block;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .search-hero select,
  .search-hero input[type=text]{
    width: 100%;
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #FBF8F1;
    color: var(--ink);
  }
  .search-hero input::placeholder{ color: #A79E8C; }
  .part-list{
    overflow-y: auto;
    flex: 1;
  }
  .part-row{
    width: 100%;
    text-align: left;
    padding: 12px 16px;
    background: transparent;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
  }
  .part-row-text{
    display:flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .row-manual-btn{
    flex-shrink: 0;
    background: var(--paper-alt);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-size: 15px;
    padding: 5px 8px;
    line-height: 1;
  }
  .row-manual-btn:hover{ background: var(--ok-bg); }
  .part-row.active .row-manual-btn{ background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }
  .list-legend{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 8px 16px;
    font-size: 12px;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--line-soft);
    background: var(--paper-alt);
  }
  .list-legend .legend-sample{
    display:inline-flex;
    cursor: default;
  }
  .part-row:hover{ background: var(--paper-alt); }
  .part-row.active{
    background: var(--steel-deep);
  }
  .part-row.active .p-number{ color: #E9D9C4; }
  .part-row.active .p-name{ color: #EDEAE2; }
  .p-number{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--copper-deep);
    font-weight: 600;
  }
  .p-name{
    font-size: 14px;
    font-weight: 500;
  }
  .empty-list{
    padding: 24px 16px;
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.7;
  }
  .content{
    padding: 28px;
    overflow-y: auto;
  }
  .placeholder{
    height: 100%;
    display:flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    gap: 14px;
    text-align:center;
  }
  .placeholder .mark{
    font-family: var(--font-mono);
    font-size: 44px;
    color: var(--line);
  }
  /* ---- Detail card ---- */
  .card{
    background: #FBF8F1;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-soft);
  }
  .card-top{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 22px 24px;
    border-bottom: 1px solid var(--line);
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-top .p-number-lg{
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--copper-deep);
    font-weight: 600;
    letter-spacing: 0.03em;
  }
  .product-breadcrumb{
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .card-top h2{
    margin: 4px 0 0;
    font-size: 24px;
    font-weight: 700;
  }
  .price-tag{
    font-family: var(--font-mono);
    font-size: 26px;
    font-weight: 700;
    color: var(--steel-deep);
    background: var(--ok-bg);
    padding: 8px 16px;
    border-radius: var(--radius);
    white-space: nowrap;
  }
  .price-tag span{ font-size: 13px; font-weight: 500; margin-left: 4px; color: var(--ink-soft);}
  .card-actions{ display:flex; gap:8px; }
  .card-body{
    padding: 24px;
    display:grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 28px;
  }
  .section-label{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
    margin-bottom: 10px;
    display:block;
  }
  .photo-box{
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper-alt);
    aspect-ratio: 4/3;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow: hidden;
  }
  .photo-box img{ width:100%; height:100%; object-fit: cover; display:block; }
  .photo-box .no-photo{
    color: var(--ink-soft);
    font-size: 13px;
    text-align:center;
  }
  .photo-gallery{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .photo-thumb{
    width: 96px;
    height: 96px;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--line);
    cursor: pointer;
    flex-shrink: 0;
  }
  .photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .form-photo-thumb{
    position: relative;
    width: 84px;
    height: 84px;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--line);
    flex-shrink: 0;
  }
  .form-photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .form-photo-thumb .rm-photo{
    position:absolute;
    top: 2px; right: 2px;
    width: 20px; height: 20px;
    line-height: 18px;
    text-align:center;
    background: rgba(38,36,33,0.75);
    color: #fff;
    border-radius: 50%;
    font-size: 13px;
    padding: 0;
    border: none;
  }
  .photo-grid-form{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  table.comp-table{
    width:100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  table.comp-table th{
    text-align:left;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 500;
    border-bottom: 1px solid var(--line);
    padding: 6px 8px;
  }
  table.comp-table td{
    padding: 8px;
    border-bottom: 1px solid var(--line-soft);
  }
  table.comp-table td.qty{
    font-family: var(--font-mono);
    white-space: nowrap;
    color: var(--steel-deep);
  }
  .no-comp{ font-size: 13px; color: var(--ink-soft); }
  .pdf-chip{
    display:inline-flex;
    align-items:center;
    gap: 8px;
    margin-top: 12px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper-alt);
    font-size: 13px;
    color: var(--steel-deep);
  }
  .pdf-chip button{
    background: var(--steel-deep);
    color: #EDEAE2;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: var(--radius);
    font-weight: 500;
  }
  .pdf-chip button:hover{ background: var(--copper); }
  .no-pdf{ font-size: 13px; color: var(--ink-soft); margin-top: 12px; }
  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(38,36,33,0.72);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 1000;
    padding: 24px;
  }
  .modal-box{
    background: #FBF8F1;
    border-radius: var(--radius);
    width: 100%;
    max-width: 560px;
    max-height: 85vh;
    display:flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(38,36,33,0.28);
  }
  .modal-box.wide{ max-width: 760px; }
  .modal-top{
    display:flex;
    justify-content: space-between;
    align-items:center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    gap: 10px;
  }
  .modal-top h3{ margin:0; font-size:16px; }
  .modal-body{
    padding: 16px 20px;
    overflow-y: auto;
  }
  .map-add-row{
    display:grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
    margin-bottom: 16px;
  }
  .map-add-row input{
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #FFFDF8;
    font-size: 13px;
  }
  .map-add-row input.mono{ font-family: var(--font-mono); }
  .map-list{
    display:flex;
    flex-direction: column;
    gap: 6px;
  }
  .map-row{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 8px 10px;
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    background: var(--paper-alt);
  }
  .map-row .code{
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--copper-deep);
    font-weight: 600;
    min-width: 80px;
  }
  .map-row .prod{ flex:1; font-size: 13px; }
  .map-row button{
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
    font-size: 11px;
    padding: 4px 8px;
    border-radius: var(--radius);
  }
  .map-row button:hover{ background: var(--danger); color: #FBF6EC; }
  .map-row button.row-open-btn{
    border-color: var(--steel-deep);
    color: var(--steel-deep);
  }
  .map-row button.row-open-btn:hover{ background: var(--steel-deep); color: #EDEAE2; }
  .map-empty{ font-size: 13px; color: var(--ink-soft); }
  .ai-preview{
    max-width: 220px;
    border-radius: var(--radius);
    display:block;
    margin: 10px 0;
    border: 1px solid var(--line);
  }
  .ai-result-row{
    display:flex;
    gap: 12px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper-alt);
    margin-bottom: 10px;
    align-items: flex-start;
  }
  .ai-result-row img{
    width: 72px;
    height: 72px;
    object-fit: cover;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    flex-shrink: 0;
  }
  .ai-result-main{ flex:1; }
  .ai-result-top{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }
  .ai-result-title{ font-weight:700; font-size: 14px; }
  .ai-result-code{ font-family: var(--font-mono); font-size: 12px; color: var(--copper-deep); }
  .ai-confidence{
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: var(--radius);
    background: var(--ok-bg);
    color: var(--steel-deep);
  }
  .ai-reason{ font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .ai-warning{
    display:inline-block;
    font-size: 12px;
    font-weight: 700;
    color: var(--danger);
    background: #F6E7E1;
    border: 1px solid var(--danger);
    padding: 3px 9px;
    border-radius: var(--radius);
    margin-top: 6px;
  }
  .ai-no-match{
    text-align:center;
    padding: 32px 16px;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    background: var(--paper-alt);
    font-size: 20px;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .ai-no-match-sub{
    font-size: 13px;
    font-weight: 400;
    margin-top: 6px;
    color: var(--ink-soft);
  }
  .ai-open-btn{
    margin-top: 8px;
    background: var(--steel-deep);
    color: #EDEAE2;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: var(--radius);
  }
  .ai-open-btn:hover{ background: var(--copper); }
  .auto-fill-note{
    font-size: 11px;
    color: var(--steel-deep);
    margin-top: 4px;
  }
  .notes-block{
    grid-column: 1 / -1;
    border-top: 1px solid var(--line);
    padding-top: 16px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
  }
  .confirm-bar{
    grid-column: 1/-1;
    background: #F6E7E1;
    border: 1px solid var(--danger);
    border-radius: var(--radius);
    padding: 12px 16px;
    display:flex;
    justify-content: space-between;
    align-items:center;
    font-size: 13px;
    flex-wrap: wrap;
    gap: 10px;
  }
  /* ---- Form ---- */
  .form-wrap{ max-width: 720px; }
  .form-wrap h2{ margin-top:0; }
  .field{ margin-bottom: 18px; }
  .field label{
    display:block;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .field input[type=text], .field input[type=number], .field textarea{
    width:100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #FBF8F1;
    font-family: var(--font-ui);
    font-size: 14px;
    color: var(--ink);
  }
  .field.mono input{ font-family: var(--font-mono); }
  .field textarea{ resize: vertical; min-height: 70px; }
  .two-col{ display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .comp-row{
    display:grid;
    grid-template-columns: 1fr 110px 34px;
    gap: 8px;
    margin-bottom: 8px;
  }
  .comp-row input{
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #FBF8F1;
    font-size: 13px;
  }
  .comp-row .rm{
    background: transparent;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--danger);
    font-size: 16px;
    line-height: 1;
  }
  .add-row-btn{
    font-size: 12px;
    color: var(--steel-deep);
    background: transparent;
    border: 1px dashed var(--line);
    padding: 7px 12px;
    border-radius: var(--radius);
    width: 100%;
  }
  .photo-input-box{
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 16px;
    text-align:center;
    background: var(--paper-alt);
  }
  .photo-preview{
    max-width: 220px;
    border-radius: var(--radius);
    display:block;
    margin: 10px auto 0;
  }
  .pdf-input-box{
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 16px;
    background: var(--paper-alt);
  }
  .pdf-current{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
    background: #FBF8F1;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 12px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .pdf-current button{
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
    font-size: 12px;
    padding: 5px 10px;
    border-radius: var(--radius);
  }
  .pdf-current button:hover{ background: var(--danger); color: #FBF6EC; }
  .form-actions{
    display:flex;
    gap: 10px;
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .status-msg{
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 8px;
    font-family: var(--font-mono);
  }
  .status-msg.err{ color: var(--danger); }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap: 6px;
    font-size: 15px;
    color: var(--steel-deep);
    background: var(--paper-alt);
    border: 1px solid var(--line);
    padding: 10px 18px;
    margin-bottom: 16px;
    border-radius: var(--radius);
    font-weight: 700;
  }
  .back-link:hover{ background: var(--ok-bg); border-color: var(--steel-deep); }
  @media (max-width: 760px){
    header{ padding: 18px 14px 14px; gap: 12px; }
    .brand .kanji{ font-size: 26px; }
    .brand .sub{ font-size: 10px; }
    .header-actions{ gap: 6px; flex-wrap: wrap; }

<script>
/* =====================================================================
   保存レイヤー（ブラウザ内保存 / IndexedDB）
   window.storage と同じ形にしてあるので、社内共有ファイル版に
   差し替えるときは、このブロックだけを入れ替えれば済む。
   ===================================================================== */
const DB_NAME = 'parts-ledger';
const DB_STORE = 'kv';
let _dbPromise = null;
let _idbOk = null;          // null = 未判定 / true = IndexedDB / false = メモリのみ
const _mem = new Map();     // IndexedDB が使えない環境（プレビュー等）の退避先

function openDb(){
  if(_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    if(typeof indexedDB === 'undefined'){ reject(new Error('no indexedDB')); return; }
    let req;
    try{ req = indexedDB.open(DB_NAME, 1); }catch(e){ reject(e); return; }
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('indexedDB open failed'));
    req.onblocked = () => reject(new Error('indexedDB blocked'));
  });
  return _dbPromise;
}

async function idbUsable(){
  if(_idbOk !== null) return _idbOk;
  try{ await openDb(); _idbOk = true; }
  catch(e){ _idbOk = false; }
  return _idbOk;
}

async function idbRun(mode, fn){
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, mode);
    const req = fn(tx.objectStore(DB_STORE));
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

const appStorage = {
  async get(key){
    if(await idbUsable()){
      const v = await idbRun('readonly', st => st.get(key));
      return (v === undefined) ? null : { key, value: v };
    }
    return _mem.has(key) ? { key, value: _mem.get(key) } : null;
  },
  async set(key, value){
    if(await idbUsable()) await idbRun('readwrite', st => st.put(value, key));
    else _mem.set(key, value);
    return { key, value };
  },
  async delete(key){
    if(await idbUsable()) await idbRun('readwrite', st => st.delete(key));
    else _mem.delete(key);
    return { key, deleted: true };
  },
  async list(prefix){
    const keys = (await idbUsable())
      ? await idbRun('readonly', st => st.getAllKeys())
      : Array.from(_mem.keys());
    return { keys: prefix ? keys.filter(k => String(k).startsWith(prefix)) : keys };
  },
  async clearAll(){
    if(await idbUsable()) await idbRun('readwrite', st => st.clear());
    else _mem.clear();
  },
  async isPersistent(){ return await idbUsable(); }
};

}

function uid(){

function upsertIndexEntry(part){
  const idx = partsIndex.findIndex(p => p.id === part.id);

const MAX_PDF_BYTES = 15 * 1024 * 1024; // 15MB (大きめの資料も入るようチャンク分割して保存する)
const CHUNK_SIZE = 3000000; // 1チャンクあたりの文字数(base64後、1保存キー5MB上限に余裕を持たせる)

async function saveChunkedFile(keyPrefix, id, name, dataUrl){
  const chunkCount = Math.ceil(dataUrl.length / CHUNK_SIZE) || 1;
  for(let i = 0; i < chunkCount; i++){
    const chunk = dataUrl.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
    await appStorage.set(`${keyPrefix}-chunk:${id}:${i}`, chunk, STORAGE_SHARED);
  }
  await appStorage.set(`${keyPrefix}:${id}`, JSON.stringify({ name, chunkCount }), STORAGE_SHARED);
}

async function loadChunkedFile(keyPrefix, id){
  const res = await appStorage.get(`${keyPrefix}:${id}`, STORAGE_SHARED);
  if(!res || !res.value) return null;
  const meta = JSON.parse(res.value);
  let dataUrl = '';
  for(let i = 0; i < meta.chunkCount; i++){
    const chunkRes = await appStorage.get(`${keyPrefix}-chunk:${id}:${i}`, STORAGE_SHARED);
    if(!chunkRes || !chunkRes.value) throw new Error('ファイルの一部が見つかりませんでした');
    dataUrl += chunkRes.value;
  }
  return { name: meta.name, data: dataUrl };
}

async function deleteChunkedFile(keyPrefix, id){
  let meta = null;
  try{
    const res = await appStorage.get(`${keyPrefix}:${id}`, STORAGE_SHARED);
    if(res && res.value) meta = JSON.parse(res.value);
  }catch(e){ /* 元々存在しない場合はそのまま無視 */ }
  if(meta){
    for(let i = 0; i < meta.chunkCount; i++){
      try{ await appStorage.delete(`${keyPrefix}-chunk:${id}:${i}`, STORAGE_SHARED); }catch(e){}
    }
  }
  try{ await appStorage.delete(`${keyPrefix}:${id}`, STORAGE_SHARED); }catch(e){}
}
const DOC_ACCEPT = ".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.txt,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,text/csv,text/plain";
const DOC_EXTENSIONS = ['.pdf','.doc','.docx','.xls','.xlsx','.ppt','.pptx','.csv','.txt'];

function isAllowedDocFile(file){
  const lower = file.name.toLowerCase();
  return DOC_EXTENSIONS.some(ext => lower.endsWith(ext));
}

function fileIcon(filename){
  const lower = (filename || '').toLowerCase();
  if(lower.endsWith('.pdf')) return '📄';
  if(lower.endsWith('.xls') || lower.endsWith('.xlsx') || lower.endsWith('.csv')) return '📊';
  if(lower.endsWith('.doc') || lower.endsWith('.docx') || lower.endsWith('.txt')) return '📝';
  if(lower.endsWith('.ppt') || lower.endsWith('.pptx')) return '📽️';
  return '📎';
}

function readFileAsDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function dataUrlToBlob(dataUrl){
  const [head, base64] = dataUrl.split(',');
  const mime = head.match(/:(.*?);/)[1];
  const bin = atob(base64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

// ---- CSV一括インポート ----
let csvState = { file: null, encoding: 'shift-jis', headers: [], rows: [], mapping: { partNumber: -1, name: -1, price: -1, product: -1 } };

function resetCsvState(){
  csvState = { file: null, encoding: 'shift-jis', headers: [], rows: [], mapping: { partNumber: -1, name: -1, price: -1, product: -1 } };
}

function parseCsvText(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      }else{ field += c; }
    }else{
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(c === '\r'){ /* skip */ }
      else{ field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(cell => cell.trim() !== ''));
}

function guessColumn(headers, keywords){
  for(let i = 0; i < headers.length; i++){
    const h = headers[i].toLowerCase();
    if(keywords.some(k => h.includes(k))) return i;
  }
  return -1;
}

async function handleCsvFile(file){
  csvState.file = file;
  await reparseCsvFile();
}

async function reparseCsvFile(){
  if(!csvState.file) return;
  const status = document.getElementById('csvStatus');
  try{
    const buf = await csvState.file.arrayBuffer();
    const decoder = new TextDecoder(csvState.encoding);
    const text = decoder.decode(buf);
    const allRows = parseCsvText(text);
    if(allRows.length < 1){
      csvState.headers = []; csvState.rows = [];
      if(status){ status.textContent = 'CSVの内容を読み取れませんでした。'; status.className = 'status-msg err'; }
      renderCsvBody();
      return;
    }
    csvState.headers = allRows[0].map(h => h.trim());
    csvState.rows = allRows.slice(1);
    csvState.mapping.partNumber = guessColumn(csvState.headers, ['品番','部品番号','code','part']);
    csvState.mapping.name = guessColumn(csvState.headers, ['品名','名称','部品名','name']);
    csvState.mapping.price = guessColumn(csvState.headers, ['単価','価格','金額','price']);
    csvState.mapping.product = guessColumn(csvState.headers, ['製品名','製品','product']);
    renderCsvBody();
  }catch(e){
    if(status){ status.textContent = 'CSVの読み込みに失敗しました。文字コードを変えて試してください。'; status.className = 'status-msg err'; }
  }
}

function getMappedValue(row, key){
  const idx = csvState.mapping[key];
  if(idx === -1 || idx === undefined || idx === null) return '';
  return row[idx] !== undefined ? row[idx].toString().trim() : '';
}

function csvSelectOptions(includeNone){
  const opts = csvState.headers.map((h,i) => `<option value="${i}">${escapeHtml(h || ('列' + (i+1)))}</option>`);
  return (includeNone ? [`<option value="-1">使用しない</option>`] : []).concat(opts).join('');
}

function renderCsvBody(){
  const body = document.getElementById('csvBody');
  if(!body) return;
  if(!csvState.headers.length){
    body.innerHTML = `<div class="map-empty">CSVファイルを選択してください。</div>`;
    return;
  }
  const previewRows = csvState.rows.slice(0, 5).map(row => `
    <tr>
      <td>${escapeHtml(getMappedValue(row,'partNumber'))}</td>
      <td>${escapeHtml(getMappedValue(row,'name'))}</td>
      <td>${escapeHtml(getMappedValue(row,'price'))}</td>
      <td>${escapeHtml(getMappedValue(row,'product'))}</td>
    </tr>
  `).join('');
  body.innerHTML = `
    <div class="two-col">
      <div class="field"><label>品番の列（必須）</label>
        <select id="mapPartNumber">${csvSelectOptions(false)}</select>
      </div>
      <div class="field"><label>品名の列（必須）</label>
        <select id="mapName">${csvSelectOptions(false)}</select>
      </div>
    </div>
    <div class="two-col">
      <div class="field"><label>単価の列（任意）</label>
        <select id="mapPrice">${csvSelectOptions(true)}</select>
      </div>
      <div class="field"><label>製品名の列（任意）</label>
        <select id="mapProduct">${csvSelectOptions(true)}</select>
      </div>
    </div>
    <span class="section-label">プレビュー（先頭5件・${csvState.rows.length}件中）</span>
    <div style="overflow-x:auto;">
      <table class="comp-table">
        <thead><tr><th>品番</th><th>品名</th><th>単価</th><th>製品名</th></tr></thead>
        <tbody>${previewRows}</tbody>
      </table>
    </div>
    <div class="status-msg" id="csvStatus"></div>
    <div class="form-actions">
      <button class="btn-primary" id="csvImportBtn">この内容でインポートする</button>
    </div>
  `;
  document.getElementById('mapPartNumber').value = csvState.mapping.partNumber;
  document.getElementById('mapName').value = csvState.mapping.name;
  document.getElementById('mapPrice').value = csvState.mapping.price;
  document.getElementById('mapProduct').value = csvState.mapping.product;
  document.getElementById('mapPartNumber').addEventListener('change', (e) => { csvState.mapping.partNumber = Number(e.target.value); renderCsvBody(); });
  document.getElementById('mapName').addEventListener('change', (e) => { csvState.mapping.name = Number(e.target.value); renderCsvBody(); });
  document.getElementById('mapPrice').addEventListener('change', (e) => { csvState.mapping.price = Number(e.target.value); renderCsvBody(); });
  document.getElementById('mapProduct').addEventListener('change', (e) => { csvState.mapping.product = Number(e.target.value); renderCsvBody(); });
  document.getElementById('csvImportBtn').addEventListener('click', runCsvImport);
}

async function runCsvImport(){
  const status = document.getElementById('csvStatus');
  const importBtn = document.getElementById('csvImportBtn');
  if(csvState.mapping.partNumber === -1 || csvState.mapping.name === -1){
    status.textContent = '品番と品名の列は必ず選択してください。';
    status.className = 'status-msg err';
    return;
  }
  importBtn.disabled = true;
  const byNumber = {};
  partsIndex.forEach(p => { byNumber[(p.partNumber || '').trim()] = p.id; });

  let added = 0, updated = 0, skipped = 0;
  for(let i = 0; i < csvState.rows.length; i++){
    const row = csvState.rows[i];
    const partNumber = getMappedValue(row, 'partNumber');
    if(!partNumber){ skipped++; continue; }
    const name = getMappedValue(row, 'name');
    const priceStr = getMappedValue(row, 'price').replace(/[^0-9.\-]/g, '');
    const priceNum = priceStr === '' ? null : Number(priceStr);
    const product = getMappedValue(row, 'product');

    status.textContent = `処理中… (${i+1}/${csvState.rows.length})`;

    if(byNumber[partNumber]){
      const existing = await loadPart(byNumber[partNumber]);
      if(existing){
        existing.name = name || existing.name;
        if(priceStr !== '' && !isNaN(priceNum)) existing.price = priceNum;
        if(product) existing.product = product;
        await appStorage.set('part:' + existing.id, JSON.stringify(existing), STORAGE_SHARED);
        upsertIndexEntry(existing);
        updated++;
      }else{ skipped++; }
    }else{
      const rec = {
        id: uid(), partNumber, name,
        price: (priceStr !== '' && !isNaN(priceNum)) ? priceNum : null,
        product, composition: [], notes: '', photoIds: [], hasPdf: false, pdfName: ''
      };
      await appStorage.set('part:' + rec.id, JSON.stringify(rec), STORAGE_SHARED);
      upsertIndexEntry(rec);
      byNumber[partNumber] = rec.id;
      added++;
    }
  }
  partsIndex.sort((a,b) => a.partNumber.localeCompare(b.partNumber, 'ja'));
  await saveIndex();
  applyFilter();
  importBtn.disabled = false;
  status.textContent = `完了しました。新規登録 ${added} 件／更新 ${updated} 件／スキップ ${skipped} 件`;
  status.className = 'status-msg';
}

function loadCroppedPixels(dataUrl, targetW, targetH, cropRatio){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const cropSize = Math.min(img.width, img.height) * cropRatio;
      const sx = (img.width - cropSize) / 2;
      const sy = (img.height - cropSize) / 2;
      const canvas = document.createElement('canvas');
      canvas.width = targetW; canvas.height = targetH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, cropSize, cropSize, 0, 0, targetW, targetH);
      resolve(ctx.getImageData(0, 0, targetW, targetH).data);
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

// 写真の中心付近（背景や余白を除いた部分）だけを見て、形の勾配パターンを比較する
async function computeStructHash(dataUrl){
  const size = 9;
  const data = await loadCroppedPixels(dataUrl, size, size, 0.8);
  const gray = [];
  for(let y = 0; y < size; y++){
    const row = [];
    for(let x = 0; x < size; x++){
      const i = (y * size + x) * 4;
      row.push(0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2]);
    }
    gray.push(row);
  }
  let bits = '';
  for(let y = 0; y < size; y++) for(let x = 0; x < size - 1; x++) bits += gray[y][x] > gray[y][x+1] ? '1' : '0';
  for(let x = 0; x < size; x++) for(let y = 0; y < size - 1; y++) bits += gray[y][x] > gray[y+1][x] ? '1' : '0';
  return bits;
}

async function computeColorHist(dataUrl){
  const size = 32;
  const data = await loadCroppedPixels(dataUrl, size, size, 0.8);
  const hist = new Array(12).fill(0);
  const total = size * size;
  for(let i = 0; i < data.length; i += 4){
    hist[Math.min(3, data[i] >> 6)] += 1;
    hist[4 + Math.min(3, data[i+1] >> 6)] += 1;
    hist[8 + Math.min(3, data[i+2] >> 6)] += 1;
  }
  return hist.map(v => v / total);
}

function hashSimilarity(a, b){
  let same = 0;
  for(let i = 0; i < a.length; i++) if(a[i] === b[i]) same++;
  return same / a.length;
}

function histSimilarity(h1, h2){
  let diff = 0;
  for(let i = 0; i < h1.length; i++) diff += Math.abs(h1[i] - h2[i]);
  return Math.max(0, 1 - diff / 6);
}

async function runAiIdentify(){
  const status = document.getElementById('aiStatus');
  const runBtn = document.getElementById('aiRunBtn');
  const resultsEl = document.getElementById('aiResults');
  resultsEl.innerHTML = '';
  runBtn.disabled = true;
  status.textContent = '登録済みの写真と見比べています…';

  try{
    const queryHash = await computeStructHash(aiQueryImage);
    const queryHist = await computeColorHist(aiQueryImage);
    const candidateEntries = partsIndex.filter(p => p.hasPhoto);

    const scored = [];
    for(const entry of candidateEntries){
      const full = await loadPart(entry.id);
      if(!full) continue;
      const photos = await loadPartPhotos(full);
      if(!photos.length) continue;
      let bestScore = -1, bestPhoto = null;
      for(const ph of photos){
        try{
          const h = await computeStructHash(ph.data);
          const hist = await computeColorHist(ph.data);
          const score = 0.75 * hashSimilarity(queryHash, h) + 0.25 * histSimilarity(queryHist, hist);
          if(score > bestScore){ bestScore = score; bestPhoto = ph.data; }
        }catch(e){ /* skip unreadable photo */ }
      }
      if(bestPhoto) scored.push({ part: full, photo: bestPhoto, score: bestScore });
    }

    if(scored.length === 0){
      status.textContent = '比較できる写真がありませんでした。';
      runBtn.disabled = false;
      return;
    }

    scored.sort((a, b) => b.score - a.score);
    const top = scored.slice(0, 3).filter(s => s.score >= 0.62);

    if(top.length === 0){
      status.textContent = '判定が完了しました。';
      resultsEl.innerHTML = `<div class="ai-no-match">ありません 😢<div class="ai-no-match-sub">似ている部品は見つかりませんでした。</div></div>`;
      runBtn.disabled = false;
      return;
    }

    status.textContent = `判定結果（登録済み写真 ${scored.length} 件から比較）`;
    resultsEl.innerHTML = top.map(t => {
      const confidence = t.score >= 0.88 ? 'high' : (t.score >= 0.75 ? 'medium' : 'low');
      const confLabel = { high:'確信度: 高', medium:'確信度: 中', low:'確信度: 低' }[confidence];
      const isLow = confidence === 'low';
      return `
        <div class="ai-result-row">
          <img src="${t.photo}">
          <div class="ai-result-main">
            <div class="ai-result-top">
              <span class="ai-result-title">${escapeHtml(t.part.name)}</span>
              <span class="ai-confidence">${escapeHtml(confLabel)}</span>
            </div>
            <div class="ai-result-code">${escapeHtml(t.part.partNumber)}</div>
            ${isLow ? `<div class="ai-warning">これじゃないかもしれません！</div>` : ''}
            <div class="ai-reason">画像の一致度: ${Math.round(t.score * 100)}%</div>
            <button class="ai-open-btn" data-id="${t.part.id}">この部品を開く</button>
          </div>
        </div>
      `;
    }).join('');
    resultsEl.querySelectorAll('.ai-open-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        closeAiModal();
        selectPart(btn.dataset.id);
      });
    });
    runBtn.disabled = false;
  }catch(e){
    status.textContent = `判定に失敗しました：${(e && e.message) || e}`;
    runBtn.disabled = false;
  }
}

          <span class="section-label" style="margin-top:18px;">図面・仕様書</span>
          ${part.hasPdf
            ? `<div class="pdf-chip"><span>${fileIcon(part.pdfName)} ${escapeHtml(part.pdfName || '添付ファイル')}</span><button id="openPdfBtn">ダウンロード</button></div>`
            : `<div class="no-pdf">ファイルは添付されていません。</div>`}
          <span class="section-label" style="margin-top:18px;">手順書</span>
          ${part.hasManualPdf
            ? `<div class="pdf-chip"><span>${fileIcon(part.manualPdfName)} ${escapeHtml(part.manualPdfName || '手順書')}</span><button id="openManualBtn">手順書を見る</button></div>`
            : `<div class="no-pdf">手順書は登録されていません。</div>`}
        </div>
        ${part.notes ? `<div class="notes-block"><span class="section-label">備考</span>${escapeHtml(part.notes)}</div>` : ''}
        ${confirmDeleteId === part.id ? `
          <div class="confirm-bar">
            <span>この部品を削除します。よろしいですか？</span>
            <div style="display:flex;gap:8px;">
              <button class="btn-ghost" id="cancelDelBtn">キャンセル</button>
              <button class="btn-danger" id="okDelBtn">削除する</button>
            </div>
          </div>` : ''}
      </div>
      <div class="card-top" style="border-top:1px solid var(--line);border-bottom:none;">
        <div class="card-actions">
          <button class="btn-ghost" id="editBtn">編集する</button>
          <button class="btn-danger" id="delBtn">削除する</button>
        </div>
      </div>
    </div>
  `;
  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.addEventListener('click', () => {
    selectedId = null;
    mode = 'empty';
    appEl.classList.remove('detail-active');
    renderList();
    renderEmpty();
  });
  document.getElementById('editBtn').addEventListener('click', () => openForm(part));
  contentEl.querySelectorAll('.photo-thumb').forEach(el => {
    el.addEventListener('click', () => showImageModal(photos[Number(el.dataset.idx)].data));
  });
  const openPdfBtn = document.getElementById('openPdfBtn');
  if(openPdfBtn) openPdfBtn.addEventListener('click', () => openPartPdf(part.id, part.partNumber));
  const openCalibBtn = document.getElementById('openCalibBtn');
  if(openCalibBtn) openCalibBtn.addEventListener('click', () => openPartCalib(part.id, part.partNumber));
  const openManualBtn = document.getElementById('openManualBtn');
  if(openManualBtn) openManualBtn.addEventListener('click', () => openPartManual(part.id, part.partNumber));
  document.getElementById('delBtn').addEventListener('click', () => { confirmDeleteId = part.id; renderDetail(part, photos); });
  const cancelDelBtn = document.getElementById('cancelDelBtn');
  if(cancelDelBtn) cancelDelBtn.addEventListener('click', () => { confirmDeleteId = null; renderDetail(part, photos); });
  const okDelBtn = document.getElementById('okDelBtn');
  if(okDelBtn) okDelBtn.addEventListener('click', async () => {
    await deletePartById(part.id);
    selectedId = null;
    mode = 'empty';
    appEl.classList.remove('detail-active');
    applyFilter();
    renderEmpty();
  });
}

function renderEmpty(){
  contentEl.innerHTML = `

}

async function openForm(existing){
  mode = 'form';
  appEl.classList.add('detail-active');
  const newEditing = existing ? JSON.parse(JSON.stringify(existing)) : {
    id: uid(), partNumber: '', name: '', price: '', product: '', composition: [], notes: '', photoIds: [],
    hasPdf: false, pdfName: '', hasCalibPdf: false, calibPdfName: '', hasManualPdf: false, manualPdfName: ''
  };
  newEditing._pdfPending = null;   // { name, data } when a new/changed PDF is chosen but not yet saved
  newEditing._pdfRemoved = false;  // true if user removed an existing PDF
  newEditing._calibPending = null;
  newEditing._calibRemoved = false;
  newEditing._manualPending = null;
  newEditing._manualRemoved = false;
  newEditing._newPhotos = [];        // [{id, data}] newly chosen photos, not yet saved
  newEditing._removedPhotoIds = [];  // ids of existing photos marked for removal
  newEditing._legacyPhotoRemoved = false;
  editingPart = newEditing;
  contentEl.innerHTML = `<div class="placeholder"><div class="mark">···</div><div>読み込み中です</div></div>`;
  const photos = existing ? await loadPartPhotos(existing) : [];
  if(editingPart !== newEditing || mode !== 'form') return; // superseded by a newer call
  newEditing._existingPhotos = photos;
  renderForm();
}

    <div class="form-photo-thumb"><img src="${ph.data}"><button type="button" class="rm-photo" data-kind="existing" data-id="${ph.id}">×</button></div>

    <div class="form-photo-thumb"><img src="${ph.data}"><button type="button" class="rm-photo" data-kind="pending" data-id="${ph.id}">×</button></div>

  return `<div class="photo-grid-form">${existingHtml}${pendingHtml}</div>`;
}

function readCompRows(){

// delegate remove-row clicks (rows are re-rendered each time so bind after render)
document.addEventListener('click', (e) => {
  if(e.target.classList.contains('rm') && mode === 'form'){
    syncFieldsFromDom();
    const rows = editingPart.composition;
    const idx = Number(e.target.dataset.idx);
    rows.splice(idx, 1);
    editingPart.composition = rows.length ? rows : [{name:'', qty:''}];
    renderForm();
  }
});

function compressImage(file, maxWidth, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function onSaveForm(){
  const status = document.getElementById('formStatus');
  const partNumber = document.getElementById('f-partNumber').value.trim();
  const name = document.getElementById('f-name').value.trim();
  const priceRaw = document.getElementById('f-price').value.trim();
  const product = document.getElementById('f-product').value.trim();
  const notes = document.getElementById('f-notes').value.trim();
  const composition = editingPart.composition || [];

  if(!partNumber || !name){
    status.textContent = '品番と品名は必須です。';
    status.className = 'status-msg err';
    return;
  }
  const price = priceRaw === '' ? null : Number(priceRaw);
  if(priceRaw !== '' && isNaN(price)){
    status.textContent = '単価は数値で入力してください。';
    status.className = 'status-msg err';
    return;
  }

  let hasPdf = editingPart.hasPdf && !editingPart._pdfRemoved;
  let pdfName = hasPdf ? editingPart.pdfName : '';
  if(editingPart._pdfPending){ hasPdf = true; pdfName = editingPart._pdfPending.name; }

  let hasCalibPdf = editingPart.hasCalibPdf && !editingPart._calibRemoved;
  let calibPdfName = hasCalibPdf ? editingPart.calibPdfName : '';
  if(editingPart._calibPending){ hasCalibPdf = true; calibPdfName = editingPart._calibPending.name; }

  let hasManualPdf = editingPart.hasManualPdf && !editingPart._manualRemoved;
  let manualPdfName = hasManualPdf ? editingPart.manualPdfName : '';
  if(editingPart._manualPending){ hasManualPdf = true; manualPdfName = editingPart._manualPending.name; }

  // 写真: 既存(残すもの) + 新規追加分のIDリストを組み立てる。旧形式の単一写真は新形式へ移行する。
  const keptExistingIds = (editingPart._existingPhotos || [])
    .filter(ph => !ph.legacy && !editingPart._removedPhotoIds.includes(ph.id))
    .map(ph => ph.id);
  const newPhotoIds = (editingPart._newPhotos || []).map(ph => ph.id);
  let finalPhotoIds = keptExistingIds.concat(newPhotoIds);
  let legacyMigrationId = null;
  const legacyPhoto = (editingPart._existingPhotos || []).find(ph => ph.legacy);
  if(legacyPhoto && !editingPart._legacyPhotoRemoved){
    legacyMigrationId = uid();
    finalPhotoIds = [legacyMigrationId].concat(finalPhotoIds);
  }

  const record = {
    id: editingPart.id,
    partNumber, name, price, product,
    composition, notes,
    photoIds: finalPhotoIds,
    hasPdf, pdfName,
    hasCalibPdf, calibPdfName,
    hasManualPdf, manualPdfName
  };

  status.textContent = '保存しています…';
  status.className = 'status-msg';
  try{
    if(editingPart._pdfPending){
      status.textContent = 'ファイルを保存しています…';
      await saveChunkedFile('part-pdf', record.id, editingPart._pdfPending.name, editingPart._pdfPending.data);
    }else if(editingPart._pdfRemoved){
      await deleteChunkedFile('part-pdf', record.id);
    }
    if(editingPart._calibPending){
      status.textContent = 'ファイルを保存しています…';
      await saveChunkedFile('part-calib', record.id, editingPart._calibPending.name, editingPart._calibPending.data);
    }else if(editingPart._calibRemoved){
      await deleteChunkedFile('part-calib', record.id);
    }
    if(editingPart._manualPending){
      status.textContent = 'ファイルを保存しています…';
      await saveChunkedFile('part-manual', record.id, editingPart._manualPending.name, editingPart._manualPending.data);
    }else if(editingPart._manualRemoved){
      await deleteChunkedFile('part-manual', record.id);
    }
    if(legacyMigrationId){
      await appStorage.set('part-photo:' + legacyMigrationId, legacyPhoto.data, STORAGE_SHARED);
    }
    for(const ph of (editingPart._newPhotos || [])){
      await appStorage.set('part-photo:' + ph.id, ph.data, STORAGE_SHARED);
    }
    for(const rid of (editingPart._removedPhotoIds || [])){
      try{ await appStorage.delete('part-photo:' + rid, STORAGE_SHARED); }catch(e){}
    }
    await savePart(record);
    selectedId = record.id;
    mode = 'detail';
    applyFilter();
    selectPart(record.id);
  }catch(e){
    status.textContent = `保存に失敗しました：${(e && e.name) || 'Error'} - ${(e && e.message) || e}`;
    status.className = 'status-msg err';
  }
}

}

const DEMO_VERSION = 'okuba-2';  // サンプルを変更したらここを更新する

async function seedDemoData(){
  let existing = null, ver = null;
  try{ existing = await appStorage.get('parts:index', STORAGE_SHARED); }catch(e){}
  try{ ver = await appStorage.get('demo:version', STORAGE_SHARED); }catch(e){}
  const sameVersion = ver && ver.value === DEMO_VERSION;
  if(existing && existing.value && sameVersion) return;
  // 旧いサンプルが残っている場合は入れ替える
  if(existing && existing.value && !sameVersion) await appStorage.clearAll();

  const index = [];
  for(const r of DEMO_ROWS){
    const id = uid();
    const photoIds = [];
    if(DEMO_PHOTOS[r.pn]){
      const pid = uid();
      await appStorage.set('part-photo:' + pid, demoSvg(DEMO_PHOTOS[r.pn]), STORAGE_SHARED);
      photoIds.push(pid);
    }
    const rec = {
      id: id, partNumber: r.pn, name: r.name, price: r.price, product: r.product,
      composition: r.comp || [], notes: r.notes || '', photoIds: photoIds,
      hasPdf:false, pdfName:'', hasCalibPdf:false, calibPdfName:'', hasManualPdf:false, manualPdfName:''
    };
    await appStorage.set('part:' + id, JSON.stringify(rec), STORAGE_SHARED);
    index.push({ id: id, partNumber: rec.partNumber, name: rec.name, price: rec.price, product: rec.product, hasPhoto: photoIds.length > 0, hasManualPdf: false });
  }
  index.sort(function(a,b){ return a.partNumber.localeCompare(b.partNumber, 'ja'); });
  await appStorage.set('parts:index', JSON.stringify(index), STORAGE_SHARED);

  const map = {};
  DEMO_ROWS.forEach(function(r){ map[normalizeCode(r.pn)] = r.product; });
  await appStorage.set('product-map', JSON.stringify(map), STORAGE_SHARED);
  await appStorage.set('demo:version', DEMO_VERSION, STORAGE_SHARED);
}

async function resetDemoData(){
  let ok = true;
  try{ ok = window.confirm('登録内容をすべて消して、デモデータの状態に戻します。よろしいですか？'); }
  catch(e){ ok = true; }   // 確認ダイアログが使えない環境ではそのまま実行する
  if(ok === false) return;
  await appStorage.clearAll();
  await seedDemoData();
  await Promise.all([loadIndex(), loadProductMap()]);
  selectedId = null;
  confirmDeleteId = null;
  mode = 'empty';
  appEl.classList.remove('detail-active');
  renderEmpty();
}
